app-id: io.github.falldaemon.engplayer
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: engplayer
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --filesystem=xdg-download
  - --filesystem=xdg-music
  - --filesystem=xdg-pictures
  - --filesystem=xdg-videos
  - --filesystem=/run/media
  - --filesystem=/media

cleanup:
  - /share/bash-completion
  - /share/doc
  - /share/fish
  - /share/man
  - /share/zsh

modules:
  - python3-requirements.yaml

  - name: gst-python
    buildsystem: meson
    config-opts:
      - -Dtests=disabled
      - -Dplugin=disabled
    sources:
      - type: archive
        url: https://gstreamer.freedesktop.org/src/gst-python/gst-python-1.28.6.tar.xz
        sha256: 34d58440c53b5495a123d0a4b7b7abbc6e9792a5b21954db86a0791b16f6e012
        x-checker-data:
          type: html
          url: https://gstreamer.freedesktop.org/src/gst-python/
          version-pattern: gst-python-(1\.28\.\d+)\.tar\.xz
          url-template: https://gstreamer.freedesktop.org/src/gst-python/gst-python-$version.tar.xz

  - name: engplayer
    buildsystem: simple
    build-commands:
      - make install prefix=/app
    sources:
      - type: dir
        path: .
